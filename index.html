<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Job Finder</h1>
    <p>Search live job listings, then filter and sort the results.</p>
  </header>

  <main>
    <div class="search">
      <input id="query" type="text" placeholder="e.g. software engineer in Kigali" />
      <button id="searchBtn">Search</button>
    </div>

    <div class="controls" id="controls" hidden>
      <input id="filterText" type="text" placeholder="Filter by title or company…" />
      <select id="filterType">
        <option value="">All job types</option>
        <option value="FULLTIME">Full-time</option>
        <option value="PARTTIME">Part-time</option>
        <option value="CONTRACTOR">Contract</option>
        <option value="INTERN">Internship</option>
      </select>
      <label><input type="checkbox" id="remoteOnly" /> Remote only</label>
      <select id="sortBy">
        <option value="newest">Newest first</option>
        <option value="title">Title (A–Z)</option>
        <option value="company">Company (A–Z)</option>
      </select>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="results"></div>
  </main>

  <footer>
    Data from <a href="https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch" target="_blank" rel="noopener">JSearch</a> via RapidAPI.
  </footer>
  <script src="app.js"></script>
</body>
</html>
