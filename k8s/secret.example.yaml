# Copy to secret.yaml, put your real key below, and NEVER commit secret.yaml.
# Or skip the file: kubectl create secret generic job-finder-secret --from-literal=RAPIDAPI_KEY=your_key_here
apiVersion: v1
kind: Secret
metadata:
  name: job-finder-secret
type: Opaque
stringData:
  RAPIDAPI_KEY: your_key_here
