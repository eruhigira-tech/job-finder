# For the lab load balancer (Lb01). Replace the two addresses, then:
#   haproxy -c -f /etc/haproxy/haproxy.cfg   (validate)
#   sudo service haproxy reload
global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    option forwardfor              # passes the visitor IP so the rate limiter works
    default_backend webservers

backend webservers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 <WEB01_ADDRESS>:80 check
    server web02 <WEB02_ADDRESS>:80 check
