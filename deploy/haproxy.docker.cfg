global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    option forwardfor
    default_backend webservers

backend webservers
    balance roundrobin
    option httpchk GET /health
    server web1 web1:3000 check
    server web2 web2:3000 check
